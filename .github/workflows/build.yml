name: Build Armbian

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Clone Armbian build system
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build

      - name: Copy userpatches
        run: |
          cp -r userpatches/* armbian-build/userpatches/

      - name: Build image
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=pinetab2-v0.1 \
            BRANCH=vendor \
            RELEASE=noble \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            SHARE_LOG=no

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-PineTab2-v0.1
          path: armbian-build/output/images/*.img
          retention-days: 14
