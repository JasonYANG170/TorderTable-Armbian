name: Build Armbian

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Clone Armbian build system
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build
          mkdir -p armbian-build/userpatches/config/boards
          mkdir -p armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt
          mkdir -p armbian-build/userpatches/customize/images

      - name: Copy userpatches
        run: |
          cp userpatches/config/boards/*.csc armbian-build/userpatches/config/boards/
          cp userpatches/patch/kernel/rk35xx-vendor-6.1/dt/* armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt/
          cp userpatches/customize/images/*.sh armbian-build/userpatches/customize/images/ 2>/dev/null || true
          # Copy pre-compiled DTB to kernel DTB directory (ensures it's installed to boot partition)
          mkdir -p armbian-build/output/cache/sources/rk35xx-vendor-6.1/arch/arm64/boot/dts/rockchip/
          cp dtb/rockchip/rk3566-torder-tablet.dtb armbian-build/output/cache/sources/rk35xx-vendor-6.1/arch/arm64/boot/dts/rockchip/ 2>/dev/null || true
          ls -la armbian-build/userpatches/config/boards/
          ls -la armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt/
          ls -la armbian-build/userpatches/customize/images/ 2>/dev/null || true

      - name: Build image
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=torder-tablet \
            BRANCH=vendor \
            RELEASE=noble \
            BUILD_DESKTOP=yes \
            BUILD_MINIMAL=no \
            DESKTOP_ENVIRONMENT=gnome \
            DESKTOP_APPGROUPS_SELECTED="browsers editors" \
            KERNEL_CONFIGURE=no \
            SHARE_LOG=no

      - name: Compress image for release
        run: |
          cd armbian-build/output/images
          sudo apt-get install -y xz-utils
          for img in *.img; do
            echo "Compressing $img..."
            sudo xz -T0 -6 "$img"
          done
          sudo ls -lh *.img.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-TorderTablet
          path: armbian-build/output/images/*.img.xz
          retention-days: 14

      - name: Get build info
        id: info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y%m%d")
          echo "tag=build-${BUILD_DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=Armbian Torder Tablet ${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          body: |
            ## Armbian Torder Tablet (RK3566)

            **Board**: Torder Tablet
            **SoC**: Rockchip RK3566
            **Kernel**: 6.1.115-vendor-rk35xx
            **OS**: Ubuntu Noble 24.04
            **Commit**: ${{ github.sha }}

            ### Features
            - GNOME Desktop on Wayland
            - Vendor kernel with RK35XX support
            - PARTLABEL fix for reliable reboot (no initramfs hang)
            - GPU Panfrost hardware acceleration
            - CPU/GPU max performance mode
            - Display 100Hz refresh rate
            - GPT partition table with SPL blobs

            ### Flash
            ```bash
            # Using dd (Linux/macOS)
            sudo dd if=Armbian-*.img of=/dev/sdX bs=1M status=progress

            # Using balenaEtcher (Windows/macOS/Linux)
            # Select the .img file and target SD card
            ```
          files: armbian-build/output/images/*.img.xz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
