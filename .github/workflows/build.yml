name: Build Armbian

env:
  # These are the exact build framework and kernel revisions used by the
  # extracted image whose UWE5621DS WiFi scan and hotspot are known to work.
  ARMBIAN_BUILD_COMMIT: 676832645ddde2e463b689e55fdd7ac81590f1ff
  ROCKCHIP_KERNEL_COMMIT: 41da3e69e16b9de57eca897215e8b0adc6efdc8b
  UWE5621DS_SOURCE_COMMIT: 4c63dfbe1e860c45a7c5e326cddd1a87f44e4fb3
  ROCKCHIP_MPP_COMMIT: c08762ebfadeb4e986d2fed993bc7a54862d3ebe
  RKNN_TOOLKIT_COMMIT: 59a913d172e7f5ff03c9076e2ec7b1b1288ffd08
  RKNN_RUNTIME_SHA256: d31fc19c85b85f6091b2bd0f6af9d962d5264a4e410bfb536402ec92bac738e8
  RKNN_HEADER_SHA256: c48e11a6f41b451a5fd1e4ad774ea60252d3d94f78bee9b21ea3d21b21deba9a
  RKNN_MODEL_SHA256: 92b36515616fc568ddc573f07a345cf28441efe0d24ecc9b98051fe8bcfad980
  PYLIBFDT_FIX_COMMIT: 5008d1d6a356b8d0a78060da2e1021507d529cff
  UWE5621DS_SRCVERSION: 50D3A59AC5058B3C5B7E57D
  UWE5621DS_2ANT_INI_SHA256: 7daa38ae65de45f47d21d9a381dfef295930ebd0c4a335dfed908075e03747d8
  UWE5621DS_3ANT_INI_SHA256: 66650cf7682c767a10399020e5294b74da233cdffee20310cdb005ae43b79b9f

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate build inputs
        run: |
          bash -n scripts/post-build.sh
          bash -n assets/uwe5621ds/torder-wifi-mac
          python3 -m py_compile assets/display/torder-night-light.py
          bash -n scripts/prepare-pylibfdt.sh
          grep -F "PYLIBFDT_FIX_COMMIT=\"$PYLIBFDT_FIX_COMMIT\"" \
            scripts/prepare-pylibfdt.sh
          DRIVER_PATCH=userpatches/kernel/rk35xx-vendor-6.1/0001-uwe5621ds-rockchip-driver.patch
          MAC_PATCH=userpatches/kernel/rk35xx-vendor-6.1/0002-uwe5621ds-load-device-mac.patch
          test -f "$DRIVER_PATCH"
          test -f "$MAC_PATCH"
          grep -F "$UWE5621DS_SOURCE_COMMIT" "$DRIVER_PATCH"
          grep -F "UWE5621DS_SRCVERSION=\"$UWE5621DS_SRCVERSION\"" scripts/post-build.sh
          grep -F ' ccflags-y += -DUWE5621_FTR' "$DRIVER_PATCH"
          grep -F '+#ccflags-y += -DIBSS_SUPPORT -DIBSS_RSN_SUPPORT' "$DRIVER_PATCH"
          grep -F '+#ccflags-y += -DNAN_SUPPORT' "$DRIVER_PATCH"
          grep -F '+#ccflags-y += -DRTT_SUPPORT' "$DRIVER_PATCH"
          grep -F '+#ccflags-y += -DRND_MAC_SUPPORT' "$DRIVER_PATCH"
          grep -F '+#ccflags-y += -DOTT_UWE' "$DRIVER_PATCH"
          grep -F 'request_firmware(&fw, fw_path, dev)' "$MAC_PATCH"
          grep -F 'const struct firmware *fw = NULL' "$MAC_PATCH"
          grep -F 'is_valid_ether_addr(mac_addr)' "$MAC_PATCH"
          grep -F 'sprdwl_init_mac_addr(dev, priv)' \
            "$DRIVER_PATCH"
          grep -Fx 'assets/uwe5621ds/*.ini -text -diff' .gitattributes
          printf '%s  %s\n' "$UWE5621DS_2ANT_INI_SHA256" \
            assets/uwe5621ds/wifi_56630001_2ant.ini | sha256sum --check -
          printf '%s  %s\n' "$UWE5621DS_3ANT_INI_SHA256" \
            assets/uwe5621ds/wifi_56630001_3ant.ini | sha256sum --check -
          echo 'd6e1ce8f8e54298680dda5bd721dbe3bed51abe1463fdfcf5dfdf4985d4e2b35  dtb/rockchip/rk3566-torder-tablet.dtb' | sha256sum --check -
          grep -F 'clock-frequency = <101147760>;' \
            userpatches/patch/kernel/rk35xx-vendor-6.1/dt/rk3566-torder-tablet.dts
          grep -F 'RKNN_QUERY_PERF_RUN' assets/rknpu/rknn-smoke-test.c
          grep -Fx 'PACKAGE_LIST_BOARD="dnsmasq-base snapd chromium-browser xdg-utils libcap2-bin gnome-software gnome-software-plugin-snap alsa-utils"' \
            userpatches/config/boards/torder-tablet.csc
          grep -F "setcap \"\$SNAP_CONFINE_CAPS\"" scripts/post-build.sh
          grep -F 'chromium_3506.snap' scripts/post-build.sh
          grep -F 'core22_2438.snap' scripts/post-build.sh
          grep -F 'snap-store_1391.snap' scripts/post-build.sh
          grep -F 'getent ahosts api.snapcraft.io' scripts/post-build.sh
          grep -F 'mount --bind /dev "$TMPDIR/dev"' scripts/post-build.sh
          grep -F 'IMAGE_GROWTH_MIB=4096' scripts/post-build.sh
          grep -F 'parted --script --fix "$IMG" resizepart 1 100%' scripts/post-build.sh
          grep -F 'resize2fs "${LOOP}p1"' scripts/post-build.sh
          grep -F "sset 'Playback Path' SPK" scripts/post-build.sh
          test "$(git hash-object config-6.1.115-vendor-rk35xx)" = '0bd97a22cecfd4fd73dec1a585bb59e1dff8f3f0'
          for option in \
            'CONFIG_ROCKCHIP_RKNPU=y' \
            'CONFIG_WCN_BSP_DRIVER_BUILDIN=y' \
            'CONFIG_RK_WIFI_DEVICE_UWE5621=y' \
            'CONFIG_RK_WIFI_DEVICE_UWE5622=y' \
            'CONFIG_WLAN_UWE5621=m' \
            'CONFIG_WLAN_UWE5622=m' \
            'CONFIG_SPRDWL_NG=m' \
            'CONFIG_TTY_OVERY_SDIO=m' \
            '# CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR is not set'; do
            test "$(grep -Fxc "$option" config-6.1.115-vendor-rk35xx)" -eq 1
          done
          ! grep -Eq '^/memreserve/|^[[:space:]]*serial-number[[:space:]]*=|local-mac-address|linux,initrd-(start|end)' \
            userpatches/patch/kernel/rk35xx-vendor-6.1/dt/rk3566-torder-tablet.dts

      - name: Free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Pin GCC 11 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-11 g++-11 gcc-11-aarch64-linux-gnu \
            g++-11-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libcap2-bin parted e2fsprogs \
            bc cmake ninja-build python3-dev python3-venv swig
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 110
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-11 \
            /usr/local/bin/aarch64-linux-gnu-gcc
          test "$(gcc -dumpversion | cut -d. -f1)" = 11
          test "$(aarch64-linux-gnu-gcc -dumpversion | cut -d. -f1)" = 11
          test "$(printf '6 * 7\n' | bc)" = "42"
          echo "CC=gcc-11" >> "$GITHUB_ENV"
          echo "CXX=g++-11" >> "$GITHUB_ENV"

      - name: Build Rockchip MPP userspace
        run: |
          git init rockchip-mpp
          git -C rockchip-mpp remote add origin https://github.com/rockchip-linux/mpp.git
          git -C rockchip-mpp fetch --depth=1 origin "$ROCKCHIP_MPP_COMMIT"
          git -C rockchip-mpp checkout --detach FETCH_HEAD
          test "$(git -C rockchip-mpp rev-parse HEAD)" = "$ROCKCHIP_MPP_COMMIT"
          cmake -S rockchip-mpp -B rockchip-mpp-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-11 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/aarch64-linux-gnu \
            -DBUILD_TEST=ON
          cmake --build rockchip-mpp-build --parallel
          DESTDIR="$GITHUB_WORKSPACE/rockchip-mpp-rootfs" \
            cmake --install rockchip-mpp-build
          test -x rockchip-mpp-rootfs/usr/bin/mpi_enc_test
          test -x rockchip-mpp-rootfs/usr/bin/mpi_dec_test
          file rockchip-mpp-rootfs/usr/bin/mpi_enc_test | grep -F 'ARM aarch64'
          file rockchip-mpp-rootfs/usr/bin/mpi_dec_test | grep -F 'ARM aarch64'

      - name: Prepare Rockchip RKNN userspace
        run: |
          DOWNLOAD="$GITHUB_WORKSPACE/rknpu-download"
          ROOTFS="$GITHUB_WORKSPACE/rknpu-rootfs"
          BASE="https://raw.githubusercontent.com/airockchip/rknn-toolkit2/$RKNN_TOOLKIT_COMMIT"
          mkdir -p "$DOWNLOAD" \
            "$ROOTFS/usr/bin" \
            "$ROOTFS/usr/include" \
            "$ROOTFS/usr/lib/aarch64-linux-gnu" \
            "$ROOTFS/usr/share/torder-rknpu"
          curl --fail --location --retry 3 \
            "$BASE/rknpu2/runtime/Linux/librknn_api/aarch64/librknnrt.so" \
            --output "$DOWNLOAD/librknnrt.so"
          curl --fail --location --retry 3 \
            "$BASE/rknpu2/runtime/Linux/librknn_api/include/rknn_api.h" \
            --output "$DOWNLOAD/rknn_api.h"
          curl --fail --location --retry 3 \
            "$BASE/rknpu2/examples/rknn_mobilenet_demo/model/RK3566_RK3568/mobilenet_v1.rknn" \
            --output "$DOWNLOAD/mobilenet_v1.rknn"
          printf '%s  %s\n' "$RKNN_RUNTIME_SHA256" "$DOWNLOAD/librknnrt.so" | sha256sum --check -
          printf '%s  %s\n' "$RKNN_HEADER_SHA256" "$DOWNLOAD/rknn_api.h" | sha256sum --check -
          printf '%s  %s\n' "$RKNN_MODEL_SHA256" "$DOWNLOAD/mobilenet_v1.rknn" | sha256sum --check -
          install -m 755 "$DOWNLOAD/librknnrt.so" \
            "$ROOTFS/usr/lib/aarch64-linux-gnu/librknnrt.so"
          ln -s librknnrt.so \
            "$ROOTFS/usr/lib/aarch64-linux-gnu/librknn_api.so"
          install -m 644 "$DOWNLOAD/rknn_api.h" "$ROOTFS/usr/include/rknn_api.h"
          install -m 644 "$DOWNLOAD/mobilenet_v1.rknn" \
            "$ROOTFS/usr/share/torder-rknpu/mobilenet_v1.rknn"
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra \
            -I"$DOWNLOAD" assets/rknpu/rknn-smoke-test.c \
            "$DOWNLOAD/librknnrt.so" -lstdc++ -ldl -lm -lpthread \
            -Wl,-rpath,/usr/lib/aarch64-linux-gnu \
            -o "$ROOTFS/usr/bin/rknn-smoke-test"
          file "$ROOTFS/usr/bin/rknn-smoke-test" | grep -F 'ARM aarch64'
          aarch64-linux-gnu-readelf -h "$DOWNLOAD/librknnrt.so" | \
            grep -F 'Machine:                           AArch64'

      - name: Clone Armbian build system
        run: |
          git init armbian-build
          git -C armbian-build remote add origin https://github.com/armbian/build.git
          git -C armbian-build fetch --depth=1 origin "$ARMBIAN_BUILD_COMMIT"
          git -C armbian-build checkout --detach FETCH_HEAD
          test "$(git -C armbian-build rev-parse HEAD)" = "$ARMBIAN_BUILD_COMMIT"
          sed -i \
            "s#KERNELBRANCH='branch:rk-6.1-rkr5.1'#KERNELBRANCH='commit:${ROCKCHIP_KERNEL_COMMIT}'#" \
            armbian-build/config/sources/families/rk35xx.conf
          test "$(grep -c "KERNELBRANCH='commit:${ROCKCHIP_KERNEL_COMMIT}'" \
            armbian-build/config/sources/families/rk35xx.conf)" -eq 1
          mkdir -p armbian-build/userpatches/{config/boards,customize/images,dtb/rockchip}
          mkdir -p armbian-build/userpatches/kernel/rk35xx-vendor-6.1
          mkdir -p armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt

      - name: Pin Python 3 compatible pylibfdt
        run: |
          chmod +x scripts/prepare-pylibfdt.sh
          scripts/prepare-pylibfdt.sh armbian-build
          grep -F "dtc commit $PYLIBFDT_FIX_COMMIT" armbian-build/requirements.txt

      - name: Copy userpatches and DTB
        run: |
          cp userpatches/config/boards/*.csc armbian-build/userpatches/config/boards/
          install -m 644 config-6.1.115-vendor-rk35xx armbian-build/config/kernel/linux-rk35xx-vendor.config
          cmp config-6.1.115-vendor-rk35xx armbian-build/config/kernel/linux-rk35xx-vendor.config
          cp userpatches/kernel/rk35xx-vendor-6.1/*.patch armbian-build/userpatches/kernel/rk35xx-vendor-6.1/
          for patch in \
            0001-uwe5621ds-rockchip-driver.patch \
            0002-uwe5621ds-load-device-mac.patch; do
            cmp "userpatches/kernel/rk35xx-vendor-6.1/$patch" \
              "armbian-build/userpatches/kernel/rk35xx-vendor-6.1/$patch"
          done
          cp userpatches/patch/kernel/rk35xx-vendor-6.1/dt/* armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt/
          cp userpatches/customize/images/*.sh armbian-build/userpatches/customize/images/ 2>/dev/null || true
          cp dtb/rockchip/rk3566-torder-tablet.dtb armbian-build/userpatches/dtb/rockchip/

      - name: Fix Docker config for ORAS
        run: echo '{ }' > ~/.docker/config.json

      - name: Clear Armbian cache for clean build
        run: |
          sudo rm -rf /root/.cache/armbian
          sudo rm -rf /var/cache/armbian
          echo "Cache cleared for clean rootfs"

      - name: Build image
        timeout-minutes: 150
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD=torder-tablet BRANCH=vendor RELEASE=noble \
            KERNELBRANCH="commit:${ROCKCHIP_KERNEL_COMMIT}" \
            BUILD_DESKTOP=yes BUILD_MINIMAL=no \
            DESKTOP_ENVIRONMENT=gnome \
            DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base \
            DESKTOP_APPGROUPS_SELECTED="browsers editors" \
            KERNEL_CONFIGURE=no PREFER_DOCKER=no SHARE_LOG=no

      - name: Post-build - install device fixes
        run: |
          chmod +x scripts/post-build.sh
          sudo env \
            ROCKCHIP_MPP_ROOTFS="$GITHUB_WORKSPACE/rockchip-mpp-rootfs" \
            ROCKCHIP_MPP_COMMIT="$ROCKCHIP_MPP_COMMIT" \
            RKNPU_ROOTFS="$GITHUB_WORKSPACE/rknpu-rootfs" \
            RKNN_TOOLKIT_COMMIT="$RKNN_TOOLKIT_COMMIT" \
            bash scripts/post-build.sh armbian-build/output/images

      - name: Compress image
        run: |
          cd armbian-build/output/images
          sudo xz -T0 -6 *.img
          sudo ls -lh *.img.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-TorderTablet
          path: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/uwe5621ds-diagnostics.txt
          retention-days: 14

      - name: Upload WiFi diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UWE5621DS-diagnostics
          path: armbian-build/output/images/uwe5621ds-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Get build info
        id: info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y%m%d")
          echo "tag=build-${BUILD_DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=Armbian Torder Tablet ${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          body: |
            ## Armbian Torder Tablet (RK3566)
            **Kernel**: 6.1.115-vendor-rk35xx
            **OS**: Ubuntu Noble 24.04 (GNOME)

            ### Features
            - Filesystem UUID boot (reliable first boot and reboot)
            - GPU Panfrost acceleration
            - Power key lockscreen + backlight control
            - UWE5621DS dual-band WiFi, Bluetooth, and hotspot support
            - GPT partition with SPL blobs

            ### Flash
            ```bash
            sudo dd if=Armbian-*.img of=/dev/sdX bs=1M status=progress
            ```
          files: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/uwe5621ds-diagnostics.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
