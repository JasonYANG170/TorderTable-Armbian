name: Build Armbian

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate build inputs
        run: |
          bash -n scripts/post-build.sh
          bash -n assets/uwe5621ds/torder-wifi-mac
          echo '479cdec08ba12ed0cc7492ba3b80ed3cfa41cb405c0fce6c62913d779d9c654a  dtb/rockchip/rk3566-torder-tablet.dtb' | sha256sum --check -
          test "$(grep -c '^# CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR is not set$' config-6.1.115-vendor-rk35xx)" -eq 1
          ! grep -q '^CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR=' config-6.1.115-vendor-rk35xx
          ! grep -Eq '^/memreserve/|^[[:space:]]*serial-number[[:space:]]*=|local-mac-address|linux,initrd-(start|end)' \
            userpatches/patch/kernel/rk35xx-vendor-6.1/dt/rk3566-torder-tablet.dts

      - name: Free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Clone Armbian build system
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build
          mkdir -p armbian-build/userpatches/{config/boards,customize/images,dtb/rockchip}
          mkdir -p armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt

      - name: Copy userpatches and DTB
        run: |
          cp userpatches/config/boards/*.csc armbian-build/userpatches/config/boards/
          sed -i \
            -e '/^CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR=/d' \
            -e '/^# CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR is not set$/d' \
            armbian-build/config/kernel/linux-rk35xx-vendor.config
          echo '# CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR is not set' >> armbian-build/config/kernel/linux-rk35xx-vendor.config
          test "$(grep -c '^# CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR is not set$' armbian-build/config/kernel/linux-rk35xx-vendor.config)" -eq 1
          ! grep -q '^CONFIG_WIFI_GENERATE_RANDOM_MAC_ADDR=' armbian-build/config/kernel/linux-rk35xx-vendor.config
          cp userpatches/patch/kernel/rk35xx-vendor-6.1/dt/* armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt/
          cp userpatches/customize/images/*.sh armbian-build/userpatches/customize/images/ 2>/dev/null || true
          cp dtb/rockchip/rk3566-torder-tablet.dtb armbian-build/userpatches/dtb/rockchip/

      - name: Fix Docker config for ORAS
        run: echo '{ }' > ~/.docker/config.json

      - name: Clear Armbian cache for clean build
        run: |
          sudo rm -rf /root/.cache/armbian
          sudo rm -rf /var/cache/armbian
          echo "Cache cleared for clean rootfs"

      - name: Build image
        timeout-minutes: 150
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=torder-tablet BRANCH=vendor RELEASE=noble \
            BUILD_DESKTOP=yes BUILD_MINIMAL=no \
            DESKTOP_ENVIRONMENT=gnome \
            DESKTOP_APPGROUPS_SELECTED="browsers editors" \
            KERNEL_CONFIGURE=no SHARE_LOG=no

      - name: Post-build - install device fixes
        run: |
          chmod +x scripts/post-build.sh
          sudo bash scripts/post-build.sh armbian-build/output/images

      - name: Compress image
        run: |
          cd armbian-build/output/images
          sudo xz -T0 -6 *.img
          sudo ls -lh *.img.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-TorderTablet
          path: armbian-build/output/images/*.img.xz
          retention-days: 14

      - name: Get build info
        id: info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y%m%d")
          echo "tag=build-${BUILD_DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=Armbian Torder Tablet ${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          body: |
            ## Armbian Torder Tablet (RK3566)
            **Kernel**: 6.1.115-vendor-rk35xx
            **OS**: Ubuntu Noble 24.04 (GNOME)

            ### Features
            - Filesystem UUID boot (reliable first boot and reboot)
            - GPU Panfrost acceleration
            - Power key lockscreen + backlight control
            - UWE5621DS dual-band WiFi, Bluetooth, and hotspot support
            - GPT partition with SPL blobs

            ### Flash
            ```bash
            sudo dd if=Armbian-*.img of=/dev/sdX bs=1M status=progress
            ```
          files: armbian-build/output/images/*.img.xz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
