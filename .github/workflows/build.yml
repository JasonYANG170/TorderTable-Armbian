name: Build Armbian

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Clone Armbian build system
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build
          mkdir -p armbian-build/userpatches/config/boards
          mkdir -p armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt

      - name: Copy userpatches
        run: |
          cp userpatches/config/boards/*.csc armbian-build/userpatches/config/boards/
          cp userpatches/patch/kernel/rk35xx-vendor-6.1/dt/* armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt/
          ls -la armbian-build/userpatches/config/boards/
          ls -la armbian-build/userpatches/patch/kernel/rk35xx-vendor-6.1/dt/

      - name: Build image
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=torder-tablet \
            BRANCH=vendor \
            RELEASE=noble \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            SHARE_LOG=no

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-TorderTablet
          path: armbian-build/output/images/*.img
          retention-days: 14
